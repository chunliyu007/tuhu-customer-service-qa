<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>途虎智能客服对话质检分析系统</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 40px; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .header p { font-size: 1.1em; opacity: 0.9; }
        .upload-section {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 8px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover { background: #f8f9ff; border-color: #764ba2; }
        .upload-area.dragover { background: #e8ebff; border-color: #764ba2; }
        .upload-icon { font-size: 4em; margin-bottom: 20px; }
        .upload-text { font-size: 1.2em; color: #333; margin-bottom: 10px; }
        .upload-hint { color: #666; font-size: 0.9em; }
        #fileInput { display: none; }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .progress { display: none; margin-top: 20px; }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .results { display: none; }
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .card h3 { color: #667eea; margin-bottom: 15px; font-size: 1.1em; }
        .card .number { font-size: 2.5em; font-weight: bold; color: #333; }
        .card .label { color: #666; margin-top: 5px; }
        .problem-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .problem-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .problem-title { font-size: 1.5em; color: #333; }
        .problem-badge {
            background: #ff6b6b;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
        }
        .case-item {
            background: #f8f9ff;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .case-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .session-id {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
        }
        .category { color: #666; font-size: 0.9em; }
        .reason {
            color: #333;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .defect {
            background: #fff3cd;
            border-left: 3px solid #ffc107;
            padding: 10px;
            margin-top: 10px;
            font-size: 0.9em;
            color: #856404;
        }
        .export-btn {
            background: #28a745;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 途虎智能客服对话质检分析系统</h1>
            <p>上传客服对话Excel文件，自动识别问题并生成优化建议</p>
        </div>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <div class="upload-text">点击或拖拽上传Excel文件</div>
                <div class="upload-hint">支持 .xlsx 和 .xls 格式</div>
                <input type="file" id="fileInput" accept=".xlsx,.xls">
            </div>
            <button class="btn" id="analyzeBtn" disabled>开始分析</button>
            <div class="progress" id="progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>
            </div>
        </div>

        <div class="results" id="results">
            <div class="summary-cards" id="summaryCards"></div>
            <div id="problemSections"></div>
        </div>
    </div>

    <script>
        let uploadedData = null;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const results = document.getElementById('results');

        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                uploadedData = XLSX.utils.sheet_to_json(firstSheet);
                
                document.querySelector('.upload-text').textContent = `已上传: ${file.name}`;
                document.querySelector('.upload-hint').textContent = `共 ${uploadedData.length} 条对话记录`;
                analyzeBtn.disabled = false;
            };
            reader.readAsArrayBuffer(file);
        }

        analyzeBtn.addEventListener('click', analyzeData);

        function analyzeData() {
            progress.style.display = 'block';
            analyzeBtn.disabled = true;
            
            let currentProgress = 0;
            const interval = setInterval(() => {
                currentProgress += 10;
                progressFill.style.width = currentProgress + '%';
                progressFill.textContent = currentProgress + '%';
                
                if (currentProgress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        performAnalysis();
                        progress.style.display = 'none';
                        results.style.display = 'block';
                    }, 500);
                }
            }, 200);
        }

        function performAnalysis() {
            const patterns = {
                '死循环/重复提问': [],
                '答非所问': [],
                '零回复': [],
                '多商品对比缺失': [],
                '价格异议应对不足': []
            };

            uploadedData.forEach((row, index) => {
                const sessionId = row['session_id'] || row['会话ID'] || index;
                const userQuestion = row['user_question'] || row['用户问题'] || '';
                const csAnswer = row['cs_answer'] || row['客服回答'] || '';
                const reason = row['common_sense_reason'] || row['评判原因'] || '';
                const defect = row['defect_reason'] || row['缺陷原因'] || '';
                const answerIssue = row['answer_issue'] || row['是否合理'] || '';
                
                if (answerIssue === '不合理' || reason.includes('不合理')) {
                    if (reason.includes('重复') || reason.includes('死循环') || reason.includes('反复')) {
                        patterns['死循环/重复提问'].push({
                            sessionId,
                            primary: row['primary_category'] || '未分类',
                            secondary: row['secondary_category'] || '未分类',
                            reason: reason.substring(0, 200),
                            defect: defect.substring(0, 200)
                        });
                    } else if (reason.includes('答非所问') || reason.includes('未回应')) {
                        patterns['答非所问'].push({
                            sessionId,
                            primary: row['primary_category'] || '未分类',
                            secondary: row['secondary_category'] || '未分类',
                            reason: reason.substring(0, 200),
                            defect: defect.substring(0, 200)
                        });
                    } else if (csAnswer === 'nan' || csAnswer === '' || !csAnswer) {
                        patterns['零回复'].push({
                            sessionId,
                            primary: row['primary_category'] || '未分类',
                            secondary: row['secondary_category'] || '未分类',
                            reason: reason.substring(0, 200),
                            defect: defect.substring(0, 200)
                        });
                    } else if (reason.includes('对比') || reason.includes('多款') || reason.includes('横向')) {
                        patterns['多商品对比缺失'].push({
                            sessionId,
                            primary: row['primary_category'] || '未分类',
                            secondary: row['secondary_category'] || '未分类',
                            reason: reason.substring(0, 200),
                            defect: defect.substring(0, 200)
                        });
                    } else if (reason.includes('价格') && (reason.includes('质疑') || reason.includes('异议') || reason.includes('贵'))) {
                        patterns['价格异议应对不足'].push({
                            sessionId,
                            primary: row['primary_category'] || '未分类',
                            secondary: row['secondary_category'] || '未分类',
                            reason: reason.substring(0, 200),
                            defect: defect.substring(0, 200)
                        });
                    }
                }
            });

            displayResults(patterns);
        }

        function displayResults(patterns) {
            const total = uploadedData.length;
            const unreasonable = Object.values(patterns).reduce((sum, arr) => sum + arr.length, 0);
            
            const summaryCards = document.getElementById('summaryCards');
            summaryCards.innerHTML = `
                <div class="card">
                    <h3>总对话数</h3>
                    <div class="number">${total}</div>
                    <div class="label">条对话记录</div>
                </div>
                <div class="card">
                    <h3>问题对话数</h3>
                    <div class="number">${unreasonable}</div>
                    <div class="label">${((unreasonable/total)*100).toFixed(1)}% 存在问题</div>
                </div>
                <div class="card">
                    <h3>问题类型</h3>
                    <div class="number">${Object.keys(patterns).filter(k => patterns[k].length > 0).length}</div>
                    <div class="label">种主要问题</div>
                </div>
                <div class="card">
                    <h3>优先级</h3>
                    <div class="number">P0</div>
                    <div class="label">需立即优化</div>
                </div>
            `;

            const problemSections = document.getElementById('problemSections');
            problemSections.innerHTML = '';

            Object.entries(patterns).forEach(([patternName, cases]) => {
                if (cases.length === 0) return;

                const section = document.createElement('div');
                section.className = 'problem-section';
                section.innerHTML = `
                    <div class="problem-header">
                        <div class="problem-title">📊 ${patternName}</div>
                        <div class="problem-badge">${cases.length} 个案例 (${((cases.length/unreasonable)*100).toFixed(1)}%)</div>
                    </div>
                    ${cases.slice(0, 10).map(c => `
                        <div class="case-item">
                            <div class="case-header">
                                <div class="session-id">Session ID: ${c.sessionId}</div>
                                <div class="category">${c.primary} > ${c.secondary}</div>
                            </div>
                            <div class="reason"><strong>问题描述:</strong> ${c.reason}...</div>
                            <div class="defect"><strong>根因分析:</strong> ${c.defect}...</div>
                        </div>
                    `).join('')}
                `;
                problemSections.appendChild(section);
            });
        }
    </script>
</body>
</html>
